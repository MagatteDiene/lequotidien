services:
  - type: web
    name: lequotidien-web
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Le Quotidien"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: lequotidien-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: lequotidien-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: lequotidien-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: lequotidien-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: lequotidien-db
          property: password
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: LOG_CHANNEL
        value: stderr

databases:
  - name: lequotidien-db
    databaseName: lequotidien
    user: lequotidien
    plan: free
